name: validate-npm

# Pull-request gate for the npm mirror (publish-npm.yml). It never publishes:
# read-only token, no OIDC token permission, no secrets, GitHub-hosted runner only.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same pinned CLIs as validate.yml (tests/test_validate_npm_package.py
  # keeps them equal). Bump deliberately, in its own PR.
  CLAUDE_CODE_VERSION: "2.1.289"
  CODEX_VERSION: "0.160.1"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate the package
        run: scripts/validate-npm-package.sh

      - run: pip install -r tests/requirements.txt

      - name: The validator rejects each forbidden fixture
        run: python -m pytest tests/test_validate_npm_package.py -v

      - name: Build the tarball exactly as npm would publish it
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$out"
          mkdir "$out/unpacked"
          tar -xzf "$out"/*.tgz -C "$out/unpacked"
          echo "PACKAGE_DIR=$out/unpacked/package" >> "$GITHUB_ENV"

      - name: Install the pinned Claude Code and Codex CLIs
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_VERSION}"

      - name: The packed marketplace passes the Claude Code validator
        run: |
          claude plugin validate "$PACKAGE_DIR" --strict
          claude plugin validate "$PACKAGE_DIR/plugins/k2" --strict

      - name: Codex installs the same k2 plugin from the package as from git
        # Throwaway HOME and CODEX_HOME per install; no sign-in, no model call.
        run: |
          set -euo pipefail
          install_tree() {
            HOME="$(mktemp -d)"
            export HOME
            export CODEX_HOME="$HOME/.codex"
            mkdir -p "$CODEX_HOME"
            codex plugin marketplace add "$1" >&2
            codex plugin add k2@k2 >&2
            servers="$(codex mcp list --json | tr -d '[:space:]')"
            [ "$servers" = "[]" ] || { echo "k2 contributed MCP servers: $servers" >&2; exit 1; }
            [ ! -e "$CODEX_HOME/plugins/cache/k2/k2-memory-hooks" ] || { echo "k2-memory-hooks was installed with k2" >&2; exit 1; }
            (cd "$CODEX_HOME"/plugins/cache/k2/k2/*/ && find . -type f | LC_ALL=C sort && cat .codex-plugin/plugin.json)
          }
          from_npm="$(install_tree "$PACKAGE_DIR")"
          from_git="$(install_tree "$GITHUB_WORKSPACE")"
          echo "$from_npm"
          diff <(echo "$from_git") <(echo "$from_npm")
          echo "OK: the npm package and the git checkout install the same k2 plugin"
