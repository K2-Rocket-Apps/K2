name: publish-mcp-registry

# Publishes server.json, this repository's listing for the MCP Gateway, to the
# official MCP Registry (registry.modelcontextprotocol.io) as
# com.k2-tek/gateway, at the version of a tagged plugin release.
#
# Two entry points, and no other:
#
# * pull_request: the `validate` job runs scripts/validate-server-json.sh on
#   the change and proves, against tests/fixtures/server-json/, that the
#   validator rejects every forbidden fixture. Read-only token, no secrets, no
#   environment; it never publishes.
#
# * workflow_call from release.yml's `mcp-registry` job, with the release tag,
#   after the GitHub Release is published: the `publish` job. release.yml runs
#   for a hand-pushed `v<digit>...` tag and for its own dispatch path, so every
#   release reaches the registry through it. There is deliberately no tag
#   trigger here: a hand-pushed tag already reaches this workflow through
#   release.yml (a second trigger would publish twice), a tag release.yml
#   creates on dispatch would never start one, and an `agent-v*` tag matches
#   neither release.yml's `v[0-9]*` filter nor anything here.
#
# The publish job runs in the `mcp-registry` environment, whose required
# reviewer must approve it, so a tag alone never publishes. It authenticates
# with DNS (an Ed25519 key whose public half is the k2-tek.com apex TXT
# record); the private key exists only as that environment's secret and is
# never printed. Always on a GitHub-hosted runner.
on:
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.4.1"
        required: true
        type: string
    secrets:
      MCP_REGISTRY_PRIVATE_KEY:
        description: "Hex Ed25519 private key for DNS auth on k2-tek.com (an environment secret of mcp-registry)"
        required: false

permissions:
  contents: read

env:
  SERVER_NAME: com.k2-tek/gateway
  REGISTRY_URL: https://registry.modelcontextprotocol.io
  WEBSITE_URL: https://gateway.k2-tek.com/docs
  # The pinned mcp-publisher release, and the SHA-256 of its linux_amd64
  # archive. Both are checked: this pin, and the release's own checksum file.
  # Bump deliberately, in its own PR.
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Every tag, so the version check can find the latest release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate server.json
        # A release-bump pull request may carry the next version before its tag exists.
        run: scripts/validate-server-json.sh --allow-pending-bump

      - run: pip install -r tests/requirements.txt

      - name: The validator rejects each forbidden fixture
        run: python -m pytest tests/test_validate_server_json.py -v

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner requires a reviewer on this environment before anything is
    # published. The DNS-auth private key is this environment's secret.
    environment: mcp-registry
    concurrency:
      group: publish-mcp-registry-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Version gate (tag must equal server.json and every manifest version)
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like vX.Y.Z"; exit 1; }
          python tests/version_consistency.py --tag "$TAG"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "::error::$TAG is not reachable from main"; exit 1; }

      - name: Validate server.json (strict, against the latest release tag)
        run: |
          set -euo pipefail
          latest="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          [ "$latest" = "$TAG" ] || { echo "::error::latest release tag at HEAD is $latest, not $TAG"; exit 1; }
          scripts/validate-server-json.sh

      - name: Pre-publish gate (websiteUrl must be live)
        # Fail closed: the listing links here, so never publish it while it 404s.
        run: curl -fsS -o /dev/null "$WEBSITE_URL"

      - name: Install the pinned mcp-publisher (checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          asset="mcp-publisher_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o checksums.txt "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -
          grep -E "^[0-9a-f]{64}  ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" mcp-publisher
          echo "$dir" >> "$GITHUB_PATH"

      - name: Skip when this version is already listed
        id: existing
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          curl -fsS --get --data-urlencode "search=${SERVER_NAME}" "${REGISTRY_URL}/v0/servers" -o "$RUNNER_TEMP/listed.json"
          listed="$(python3 - "$RUNNER_TEMP/listed.json" "$SERVER_NAME" "$version" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          hits = [s for s in data.get("servers", [])
                  if (s.get("server") or {}).get("name") == sys.argv[2]
                  and (s.get("server") or {}).get("version") == sys.argv[3]]
          print("true" if hits else "false")
          PY
          )"
          [ "$listed" = "true" ] && echo "::notice::${SERVER_NAME} ${version} is already listed; nothing to do"
          echo "published=${listed}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry (DNS auth for k2-tek.com)
        if: steps.existing.outputs.published == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_PRIVATE_KEY:-}" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is empty; it must be a secret of the mcp-registry environment"
            exit 1
          fi
          if ! [[ "$MCP_REGISTRY_PRIVATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not a 64-character hex Ed25519 key"
            exit 1
          fi
          mcp-publisher login dns --domain k2-tek.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish server.json
        if: steps.existing.outputs.published == 'false'
        run: mcp-publisher publish

      - name: Log out of the registry
        if: always() && steps.existing.outputs.published == 'false'
        run: mcp-publisher logout || true

      - name: The registry lists this version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --get --data-urlencode "search=${SERVER_NAME}" "${REGISTRY_URL}/v0/servers" \
                | python3 -c '
          import json, sys
          name, version = sys.argv[1], sys.argv[2]
          servers = json.load(sys.stdin).get("servers", [])
          sys.exit(0 if any((s.get("server") or {}).get("name") == name and (s.get("server") or {}).get("version") == version for s in servers) else 1)
          ' "$SERVER_NAME" "$version"; then
              echo "OK: ${SERVER_NAME} ${version} is listed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SERVER_NAME} ${version} is not listed on ${REGISTRY_URL}"
          exit 1
