name: publish-npm

# Mirrors a tagged release of this marketplace to npm, with provenance, so
# Codex users can install it from the npm registry. The package is the git
# marketplace root (package.json `files`), so an npm install and a git install
# of the same tag are identical. Claude Code users keep using the git
# marketplace.
#
# Two entry points, and no others (never on a pull request, a branch push or a
# manual dispatch):
#   * `workflow_call` from release.yml's `npm` job, after the GitHub Release is
#     published. This is the normal path: release.yml's dispatch path creates
#     the tag with the job token, and GitHub does not start `push: tags`
#     workflows for a ref created by that token, so this workflow would
#     otherwise never run for those tags.
#   * A pushed `v<digit>...` tag. When a maintainer pushes a tag by hand,
#     release.yml runs as well and calls this workflow too; both runs share one
#     concurrency group per tag, and the second one finds the version already
#     on the registry and skips publishing.
#
# Authentication is npm trusted publishing (OIDC) only: no npm token is stored
# anywhere in this repository. npm checks the CALLING workflow's file name, so
# the package's trusted publishers on npmjs.com must list both `release.yml`
# and `publish-npm.yml`, each with environment `npm-publish`.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.4.1"
        required: true
        type: string

permissions:
  contents: read

env:
  # Trusted publishing needs npm 11.5.1 or later. Bump deliberately.
  NPM_VERSION: "11.6.2"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner can require a reviewer on this environment before anything is
    # published. It is also part of the trusted-publisher binding on npm.
    environment: npm-publish
    concurrency:
      group: publish-npm-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # OIDC for npm trusted publishing and its provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Version gate (tag must equal package.json and every manifest version)
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like vX.Y.Z"; exit 1; }
          python tests/version_consistency.py --tag "$TAG"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "::error::$TAG is not reachable from main"; exit 1; }

      - name: Install the pinned npm CLI
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Validate the package (allow-list, no install scripts, no token, no placeholder URL)
        run: scripts/validate-npm-package.sh

      - run: pip install -r tests/requirements.txt

      - name: Full test suite
        run: python -m pytest tests/ -v

      - name: Skip when this version is already on npm
        id: existing
        run: |
          set -euo pipefail
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if out="$(npm view "$spec" version 2>&1)"; then
            if [ -n "$out" ]; then
              echo "::notice::$spec is already published; nothing to do"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 <<<"$out"; then
            echo "$out" >&2
            echo "::error::could not check the registry for $spec"
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        if: steps.existing.outputs.published == 'false'
        run: npm publish --provenance --access public --ignore-scripts
