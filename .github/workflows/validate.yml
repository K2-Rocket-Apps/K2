name: validate

# Public-package gate for this marketplace. Every job runs on GitHub-hosted
# runners with a read-only token, needs no secrets, and makes no API calls.
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an upstream CLI release cannot turn CI red with no change here.
  # Bump deliberately, in its own PR.
  CLAUDE_CODE_VERSION: "2.1.289"
  CODEX_VERSION: "0.160.1"

jobs:
  claude-plugin-validate:
    # The Claude Code CLI's own manifest validator (schema-level checks). It is
    # static: no sign-in, no model call.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace
        run: claude plugin validate . --strict

      - name: Validate the k2 plugin
        run: claude plugin validate plugins/k2 --strict

  pytest:
    # Repo-specific conventions and the public-package policy
    # (tests/test_public_package_policy.py).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - run: pip install -r tests/requirements.txt

      - run: python -m pytest tests/ -v

  codex-install:
    # Codex installs the plugin from this checkout and ends up with no MCP
    # server. Uses a throwaway CODEX_HOME; no sign-in, no model call.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the pinned Codex CLI
        run: npm install -g "@openai/codex@${CODEX_VERSION}"

      - name: Add the marketplace and install k2
        run: |
          CODEX_HOME="$(mktemp -d)"
          export CODEX_HOME
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add k2@k2

      - name: Installed plugin contributes no MCP server
        run: |
          servers="$(codex mcp list --json)"
          echo "$servers"
          test "$(echo "$servers" | tr -d '[:space:]')" = "[]"
