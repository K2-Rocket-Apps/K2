name: release

# Publishes a GitHub Release for a pushed `v*` tag. This repository publishes
# only k2 plugin releases, so every release here is marked latest.
#
# Order is load-bearing: the version gate runs first, so a tag that does not
# match every manifest version fails the run before anything is built and no
# Release is created. A tag whose commit is not reachable from main fails next.
# Then the full test suite, then the source archive, its
# checksum file, a provenance attestation for both, and finally the Release.
#
# Runs on a pushed `v*` tag, or by manual dispatch with a `tag` input: the
# dispatch path checks out main, runs the same version gate, and only then
# creates and pushes the annotated tag itself (with this job's token, which
# does not re-trigger this workflow) before building the same release. Always
# on a GitHub-hosted runner. Nothing here updates an installed copy; users
# upgrade through their own plugin manager.
#
# After the Release, the `npm` job mirrors the same tag to npm through
# publish-npm.yml (trusted publishing, with provenance).
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from main, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write      # create the GitHub Release (and, on dispatch, the tag)
      id-token: write      # OIDC for the Sigstore-signed provenance
      attestations: write  # store the provenance in the repo's attestation store
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Version gate (tag must equal every manifest version)
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like vX.Y.Z"; exit 1; }
          python tests/version_consistency.py --tag "$TAG"

      - name: Create the tag from main (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists"; exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" -m "k2 ${TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "::error::$TAG is not reachable from main"; exit 1; }

      - run: pip install -r tests/requirements.txt

      - name: Full test suite
        run: python -m pytest tests/ -v

      - name: Build the source archive and SHA256SUMS
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="k2-${TAG}/" \
            -o "k2-${TAG}.tar.gz" "refs/tags/${TAG}"
          sha256sum "k2-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            k2-${{ env.TAG }}.tar.gz
            SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: python tests/version_consistency.py --notes "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "k2-${TAG}.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag --latest

  npm:
    # Mirror the released tag to npm (publish-npm.yml), only after the GitHub
    # Release above succeeded. This is publish-npm.yml's only entry point: it
    # has no tag trigger of its own (a tag this workflow creates on dispatch,
    # with the job token, would never start one anyway). npm trusted publishing
    # checks THIS file's name for a called workflow, so `release.yml` is the
    # package's trusted publisher.
    needs: release
    uses: ./.github/workflows/publish-npm.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
