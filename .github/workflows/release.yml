name: release

# Publishes a GitHub Release for a pushed `v*` tag. This repository publishes
# only k2 plugin releases, so every release here is marked latest.
#
# Order is load-bearing: the version gate runs first, so a tag that does not
# match every manifest version fails the run before anything is built and no
# Release is created. A tag whose commit is not reachable from main fails next.
# Then the full test suite, then the source archive, its
# checksum file, a provenance attestation for both, and finally the Release.
#
# Runs only on a tag push, on a GitHub-hosted runner. Nothing here updates an
# installed copy; users upgrade through their own plugin manager.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the GitHub Release and upload its assets
      id-token: write      # OIDC for the Sigstore-signed provenance
      attestations: write  # store the provenance in the repo's attestation store
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Version gate (tag must equal every manifest version)
        run: python tests/version_consistency.py --tag "$GITHUB_REF_NAME"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME is not reachable from main"; exit 1; }

      - run: pip install -r tests/requirements.txt

      - name: Full test suite
        run: python -m pytest tests/ -v

      - name: Build the source archive and SHA256SUMS
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="k2-${GITHUB_REF_NAME}/" \
            -o "k2-${GITHUB_REF_NAME}.tar.gz" "refs/tags/${GITHUB_REF_NAME}"
          sha256sum "k2-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            k2-${{ github.ref_name }}.tar.gz
            SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: python tests/version_consistency.py --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "k2-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag --latest
